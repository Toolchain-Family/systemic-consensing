server {
    listen 80;
    server_name _;

    # Relative Redirects, damit Host/Port des Browsers (z. B. localhost:3001) erhalten bleiben
    absolute_redirect off;

    root /usr/share/nginx/html;

    # Landing: / -> App
    location = / {
        return 302 /Tools/SysConsens/;
    }

    # SPA unter dem Toolchain-Subpfad
    location /Tools/SysConsens/ {
        try_files $uri $uri/ /Tools/SysConsens/index.html;
    }

    # Assets kurz cachen (hash-basiert), index.html nicht
    location ~* \.(js|css|map|png|ico|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
